stages:
  - test

playwright-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  script:
    - npm ci
    - npx playwright test
    - npx allure generate allure-results --clean -o allure-report
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/
      - allure-results/
      - allure-report/